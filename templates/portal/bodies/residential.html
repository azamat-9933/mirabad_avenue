<!-- Main Content Wrapper -->
<main class="app-main min-h-screen pt-16">
<!-- Main Page Content -->
<div class="app-page py-8">
<!-- Header Section -->
<div class="mb-8">
<h2 class="app-page-title text-3xl font-extrabold text-on-surface tracking-tight">Residential Units</h2>
</div>
<!-- Bento Grid Summary Cards -->
<div class="residential-kpi-grid grid gap-6 mb-8 motion-stagger">
<!-- Total Complexes -->
<div class="residential-kpi-card bg-surface-container-lowest p-6 rounded-lg shadow-sm border border-transparent hover:border-primary-container/10 transition-all flex flex-col justify-between" data-stat-card="total-complexes">
<div class="flex justify-between items-start mb-4">
<p class="text-xs font-bold uppercase tracking-widest text-on-surface-variant" data-i18n-key="Total Complexes">Total Complexes</p>
<div class="kpi-icon-chip kpi-icon-blue">
<span class="material-symbols-outlined" data-icon="location_city">location_city</span>
</div>
</div>
<div>
<h2 class="text-display-sm text-3xl font-black text-on-surface tracking-tight">142</h2>
<div class="kpi-support-row">
<span data-stat-support data-i18n-key="All homes connected">All homes connected</span>
</div>
</div>
</div>
<!-- Total Apartments -->
<div class="residential-kpi-card bg-surface-container-lowest p-6 rounded-lg shadow-sm border border-transparent hover:border-primary-container/10 transition-all flex flex-col justify-between" data-stat-card="active-buildings">
<div class="flex justify-between items-start mb-4">
<p class="text-xs font-bold uppercase tracking-widest text-on-surface-variant" data-i18n-key="Active Buildings">Active Buildings</p>
<div class="kpi-icon-chip kpi-icon-green">
<span class="material-symbols-outlined" data-icon="domain">domain</span>
</div>
</div>
<div>
<h2 class="text-display-sm text-3xl font-black text-on-surface tracking-tight">856</h2>
<div class="kpi-support-row">
<span data-stat-support data-i18n-key="Total apartments in system">124 active units</span>
</div>
</div>
</div>
<!-- Total Debtors: opens the list of debtors (every house, right now). -->
<div class="residential-kpi-card is-clickable bg-error-container p-6 rounded-lg shadow-sm border border-transparent hover:shadow-lg transition-all flex flex-col justify-between" data-stat-card="critical-debt-units" data-debtors-list-open role="button" tabindex="0">
<div class="flex justify-between items-start mb-4">
<p class="text-xs font-bold uppercase tracking-widest text-on-error-container/70" data-i18n-key="Critical Debt Units">Critical Debt Units</p>
<div class="kpi-icon-chip kpi-icon-red">
<span class="material-symbols-outlined" data-icon="warning">warning</span>
</div>
</div>
<div>
<h2 class="text-display-sm text-3xl font-black text-on-error-container tracking-tight">24</h2>
<div class="kpi-support-row">
<span data-stat-support data-i18n-key="Residents with overdue balance">3 require field visit</span>
</div>
</div>
</div>
</div>
<!-- Main Layout -->
<div class="residential-layout grid gap-8">
<!-- Main Table Section -->
<div class="min-w-0 bg-surface-container-lowest rounded-xl shadow-sm overflow-hidden" data-residential-performance-card>
<div class="px-6 py-5 flex flex-wrap items-center justify-between gap-3 border-b border-surface-container-low">
<div class="flex flex-col gap-3">
<h3 class="text-lg font-bold text-primary" data-residential-performance-heading>Complex Performance Overview</h3>
</div>
<button class="text-xs font-bold text-primary flex items-center gap-1 hover:underline shrink-0" data-export-context="residential" data-export-open data-export-source="Complex Performance Overview" type="button">
<span data-i18n-key="Export CSV">Export CSV</span>
<span class="material-symbols-outlined text-[14px]">download</span>
</button>
</div>
<div class="overflow-x-auto residential-table-fit">
<table class="w-full border-collapse text-left residential-performance-table" data-residential-performance-table data-status-tool="off">
<thead>
<tr class="bg-surface-container-low/50">
<th class="px-6 py-4 text-xs font-bold text-on-surface-variant uppercase tracking-wider" data-i18n-key="House">House</th>
<th class="px-6 py-4 text-xs font-bold text-on-surface-variant uppercase tracking-wider" data-i18n-key="Apartments">Apartments</th>
<th class="px-6 py-4 text-xs font-bold text-on-surface-variant uppercase tracking-wider" data-i18n-key="Area">Area</th>
<th class="px-6 py-4 text-xs font-bold text-on-surface-variant uppercase tracking-wider" data-i18n-key="Debt Status">Debt Status</th>
<th class="px-6 py-4 text-xs font-bold text-on-surface-variant uppercase tracking-wider text-right no-table-filter" data-i18n-key="Actions">Actions</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>
</div>
</div>
</div>
</main>
