{% load static %}
<main class="app-main app-main--under-sidebar min-h-screen flex flex-col pt-16 analytics-v2-shell" data-analytics-dashboard-page>
    <div class="analytics-v2-page flex-1">
        <section class="analytics-v2-hero">
            <div class="analytics-v2-hero__copy">
                <p class="analytics-v2-eyebrow" data-i18n-key="Statistics">Statistics</p>
                <h1 data-i18n-key="Analytics dashboard">Analytics dashboard</h1>
            </div>
        </section>

        <!-- Every house, the current month; balances as they stand now. -->
        <section class="analytics-v2-kpi-grid" data-analytics-dashboard>
            <article class="analytics-v2-kpi analytics-v2-kpi--blue">
                <div class="analytics-v2-kpi__label-row">
                    <span data-i18n-key="Paid this month">Paid this month</span>
                    <span class="material-symbols-outlined analytics-v2-kpi__icon">payments</span>
                </div>
                <strong data-analytics-value="paid-this-month">0 UZS</strong>
            </article>
            <article class="analytics-v2-kpi analytics-v2-kpi--red">
                <div class="analytics-v2-kpi__label-row">
                    <span data-i18n-key="Total debt">Total debt</span>
                    <span class="material-symbols-outlined analytics-v2-kpi__icon">warning</span>
                </div>
                <strong data-analytics-value="total-debt">0 UZS</strong>
            </article>
            <article class="analytics-v2-kpi analytics-v2-kpi--green">
                <div class="analytics-v2-kpi__label-row">
                    <span data-i18n-key="Overpayment">Overpayment</span>
                    <span class="material-symbols-outlined analytics-v2-kpi__icon">savings</span>
                </div>
                <strong data-analytics-value="overpayment">0 UZS</strong>
            </article>
            <!-- Opens the debtors list: every house, right now. -->
            <article class="analytics-v2-kpi analytics-v2-kpi--amber is-clickable" data-analytics-debtors-open role="button" tabindex="0">
                <div class="analytics-v2-kpi__label-row">
                    <span data-i18n-key="Debtors">Debtors</span>
                    <span class="material-symbols-outlined analytics-v2-kpi__icon">group</span>
                </div>
                <strong data-analytics-value="debtors-count">0</strong>
            </article>
        </section>

        <section class="analytics-v2-grid analytics-v2-grid--top">
            <div class="analytics-v2-stack">
                <article class="analytics-v2-panel">
                    <header class="analytics-v2-panel__head">
                        <h2 data-i18n-key="Debt by house">Debt by house</h2>
                    </header>
                    <ol class="analytics-house-debt-list" data-analytics-house-debt-list></ol>
                </article>

                <!-- What the residents of each operator's houses paid this month. -->
                <article class="analytics-v2-panel">
                    <header class="analytics-v2-panel__head">
                        <h2 data-i18n-key="Collected by operator">Collected by operator</h2>
                    </header>
                    <ol class="analytics-operator-list" data-analytics-operator-list></ol>
                    <p class="analytics-operator-hint hidden" data-analytics-operator-hint data-i18n-key="Assign an operator to each house on its admin page.">Assign an operator to each house on its admin page.</p>
                </article>
            </div>

            <article class="analytics-v2-panel analytics-v2-panel--side">
                <header class="analytics-v2-panel__head">
                    <h2 data-i18n-key="Payment channels">Payment channels</h2>
                </header>
                <div class="analytics-v2-channel-layout" data-analytics-channel-layout>
                    <div class="chart-canvas-wrap analytics-v2-chart-wrap analytics-v2-chart-wrap--pie">
                        <canvas id="analytics-channel-chart" aria-label="Payment channels chart" role="img"></canvas>
                    </div>
                    <div class="analytics-v2-channel-list" data-analytics-channel-list data-click-logo="{% static 'img/click-logo.png' %}" data-payme-logo="{% static 'img/payme-logo.png' %}"></div>
                </div>
            </article>
        </section>
    </div>
</main>
